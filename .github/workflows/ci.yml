name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install build tooling and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build
          pip install "torch>=2.0" --extra-index-url https://download.pytorch.org/whl/cpu
          pip install -e .[dev]
      - name: Build sdist & wheel
        run: |
          python -m build
      - name: Smoke import
        run: |
          python -c "import xmetai as xm; print(getattr(xm, '__version__', 'unknown'))"

name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-package:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install build tooling and dependencies
        run: |
          set -euo pipefail
          source scripts/install_torch_harmonics.sh
          python3 -m pip install --upgrade pip
          python3 -m pip install build
          python3 -m pip install "torch>=2.7.0" --extra-index-url https://download.pytorch.org/whl/cpu
          install_torch_harmonics
          python3 -m pip install -e .
      - name: Build sdist & wheel
        run: |
          python3 -m build
      - name: Smoke import
        run: |
          python3 -c "import xmetai as xm; print(getattr(xm, '__version__', 'unknown'))"

name: Unit Tests

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.py'
      - 'xmetai/**'
      - 'configs/**'
      - 'common/**'
      - 'tools/**'
      - 'scripts/**'
      - 'tests/**'
  pull_request:
    paths:
      - '**/*.py'
      - 'xmetai/**'
      - 'configs/**'
      - 'common/**'
      - 'tools/**'
      - 'scripts/**'
      - 'tests/**'

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install dependencies (Torch CPU + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install "torch>=2.0" --extra-index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[dev]'
      - name: Run tests
        run: |
          pytest tests -q --maxfail=1 --disable-warnings
  gpu-tests:
    runs-on: ThinkVision-4080
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run tests
        run: |
          pytest tests -m "gpu" -q --maxfail=1 --disable-warnings

name: Unit Tests

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.py'
      - 'xmetai/**'
      - 'configs/**'
      - 'common/**'
      - 'tools/**'
      - 'scripts/**'
      - 'tests/**'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**/*.py'
      - 'xmetai/**'
      - 'configs/**'
      - 'common/**'
      - 'tools/**'
      - 'scripts/**'
      - 'tests/**'

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install dependencies (Torch CPU + dev extras)
        run: |
          set -euo pipefail
          source scripts/install_torch_harmonics.sh
          python3 -m pip install --upgrade pip
          python3 -m pip install "torch>=2.7.0" --extra-index-url https://download.pytorch.org/whl/cpu
          install_torch_harmonics
          python3 -m pip install -e '.[dev]'
      - name: Run tests
        run: |
          python3 -m pytest tests -q --maxfail=1 --disable-warnings
  gpu-tests:
    runs-on: [self-hosted, gpu]
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: |
          set -euo pipefail
          source scripts/install_torch_harmonics.sh
          python3 -m pip install --upgrade pip
          python3 -m pip install "torch>=2.7.0"
          install_torch_harmonics
          python3 -m pip install -e '.[dev]'
      - name: Run tests
        run: |
          python3 -m pytest tests -m "gpu" -q --maxfail=1 --disable-warnings

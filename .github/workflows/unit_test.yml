name: Unit Tests

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.py'
      - 'xmetai/**'
      - 'configs/**'
      - 'common/**'
      - 'tools/**'
      - 'scripts/**'
      - 'tests/**'
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

jobs:
  pytest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install dependencies (Torch CPU + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install "torch>=2.0" --extra-index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[dev]'
      - name: Run tests
        run: |
          pytest tests -q --maxfail=1 --disable-warnings
  gpu-tests:
    runs-on: [self-hosted, gpu]
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          persist-credentials: false
      - name: Run tests
        run: |
          pytest tests -m "gpu" -q --maxfail=1 --disable-warnings

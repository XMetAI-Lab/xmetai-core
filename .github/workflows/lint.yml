name: Lint

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.py'
      - 'xmetai/**'
      - 'configs/**'
      - 'common/**'
      - 'tools/**'
      - 'scripts/**'
      - 'tests/**'
      - '.pre-commit-config.yaml'
      - 'pyproject.toml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**/*.py'
      - 'xmetai/**'
      - 'configs/**'
      - 'common/**'
      - 'tools/**'
      - 'scripts/**'
      - 'tests/**'
      - '.pre-commit-config.yaml'
      - 'pyproject.toml'

jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          set -euo pipefail
          source scripts/install_torch_harmonics.sh
          python -m pip install --upgrade pip
          pip install "torch>=2.7.0" --extra-index-url https://download.pytorch.org/whl/cpu
          install_torch_harmonics
          pip install pre-commit
          pip install -e '.[dev]'
      - name: Run pre-commit (Black + Ruff)
        run: |
          pre-commit autoupdate --repo https://github.com/pre-commit/pre-commit-hooks
          pre-commit run --all-files

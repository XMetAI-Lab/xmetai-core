# pyproject.toml
[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xmetai-core"
dynamic = ["version"]
description = "XMETAI framework for Meteorological AI model training and inference"
authors = [
  { name = "XMetAI Lab", email = "douzsh@gmail.com" }
]
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["meteorology", "AI", "deep learning", "weather", "climate"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent"
]
requires-python = ">=3.10"

dependencies = [
  "torch>=2.9.0",
  "numpy>=1.24.0",
  "einops>=0.7.0",
  "packaging>=21.0",
  "PyYAML>=6.0",
  "tqdm>=4.65.0",
  "pandas>=1.5.0",
  "omegaconf>=2.3.0",
  "hydra-core>=1.3.2",
  "yacs>=0.1.8",
  "tabulate>=0.9.0",
  "termcolor>=2.0.0",
  "cloudpickle>=2.0.0",
  "iopath>=0.1.9",
  "tensorboard>=2.14.0",
  "h5py>=3.8.0",
  "zarr>=2.15.0",
  "xarray>=2023.0.0",
  "dask>=2023.0.0",
]

[project.scripts]
xmetai-train = "xmetai.cli.train:cli"
xmetai-train-lightning = "xmetai.cli.train_lightning:cli"

[project.optional-dependencies]
gpu = [
  "mamba-ssm>=2.2.0",
]
lightning = [
  "pytorch-lightning>=2.6.0",
  "typing-extensions>=4.4.0",
]
export = [
  "torch>=2.9.0",
  "onnx>=1.14.0",
  "onnxscript>=0.5.4",
]
inference = [
  "onnx>=1.14.0",
  "onnxruntime-gpu>=1.15.0",
]
lint = [
  "black>=23.0",
  "ruff>=0.1.0",
  "mypy>=1.0",
  "isort>=5.12",
]
test = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "pytest-mock>=3.10.0",
]
dev = [
  "black>=23.0",
  "ruff>=0.1.0",
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "pytest-mock>=3.10.0",
  "mypy>=1.0",
  "isort>=5.12",
  "pre-commit>=3.0",
  "build>=0.10",
  "twine>=5.0",
]
all = [
  "torch>=2.9.0",
  "onnxscript>=0.5.4",
  "mamba-ssm>=2.2.0",
  "pytorch-lightning>=2.6.0",
  "typing-extensions>=4.4.0",
  "onnx>=1.14.0",
  "onnxruntime-gpu>=1.15.0",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.dynamic]
version = {attr = "xmetai.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["xmetai*"]

[tool.setuptools.package-data]
"xmetai.utils" = ["assets/*.geojson"]

[tool.black]
line-length = 160

[tool.ruff]
line-length = 160

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "I"]
ignore = ["C901", "E501"]  # Ignore line-too-long (handled by black)

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "F403"]
"tests/**" = ["F401", "F403", "F841"]
"xmetai/builder.py" = ["E402", "F403"]

[tool.ruff.lint.isort]
known-first-party = ["xmetai"]

[tool.mypy]
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_configs = true
strict_optional = true
disallow_incomplete_defs = true
check_untyped_defs = false
exclude = ["xmetai/cli/train\\.py$", "tests/"]
